<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administrace uživatelů</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card admin-card">
    <div class="header-row">
      <div>
        <h1>Administrace</h1>
        <p class="meta admin-subtitle">Správa registrovaných uživatelů a kreditů</p>
      </div>
      <div class="right-area">
        <a class="menu-link" href="/">Zpět na počasí</a>
        <button id="logoutBtn" class="muted" type="button">Odhlásit</button>
      </div>
    </div>

    <div id="adminError" class="error hidden" role="alert"></div>
    <div id="adminMessage" class="auth-message success-message hidden" role="status"></div>

    <div id="adminGate" class="admin-gate">
      <p class="meta">Načítám administrační rozhraní…</p>
    </div>

    <section id="adminPanel" class="admin-panel hidden">
      <div class="admin-toolbar">
        <div class="meta">Přihlášen: <strong id="adminName"></strong></div>
        <button id="refreshUsers" class="muted" type="button">Obnovit</button>
      </div>

      <div class="table-wrap">
        <table class="admin-table" aria-label="Seznam uživatelů">
          <thead>
            <tr>
              <th>Jméno</th>
              <th>E-mail</th>
              <th>Role</th>
              <th>Kredity</th>
              <th>Dobít</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
